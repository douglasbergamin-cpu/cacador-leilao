name: Caçador de Leilões Real

on:
  schedule:
    - cron: '0 9,15 * * *'
  workflow_dispatch:

jobs:
  run-leilao:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Instalar Dependências do Sistema para Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2

      - name: Instalar Dependências Python e Playwright
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Executar Robô Real
        run: python cacador_leilao.py
